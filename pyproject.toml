[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# ── PicoShogun Command Centre ──────────────────────────────

[project]
name = "picoshogun"
version = "1.0.0"
description = "Command centre for the Pico Security Series — security orchestration, firewall, and monitoring"
readme = "README.md"
license = "BUSL-1.1"
license-files = ["LICENSE*", "COMMERCIAL-LICENSE.md"]
requires-python = ">=3.10"
authors = [{name = "Henrik Kirk", email = "kirk@kirkforge.dev"}]
maintainers = [{name = "KirkForge", email = "kirk@kirkforge.dev"}]
keywords = [
    "security", "orchestration", "command-centre", "fastapi", "firewall",
    "supply-chain", "anomaly-detection", "monitoring",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Quality Assurance",
    "Environment :: Console",
    "Framework :: Pytest",
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "PyJWT>=2.8.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "requests>=2.31.0",
    "starlette>=0.27.0",
    "croniter>=1.0.0",
    "pyyaml>=6.0",
]



[project.urls]
Homepage = "https://github.com/KirkForge/PicoShogun"
Documentation = "https://github.com/KirkForge/PicoShogun#readme"
Repository = "https://github.com/KirkForge/PicoShogun"
Issues = "https://github.com/KirkForge/PicoShogun/issues"
Changelog = "https://github.com/KirkForge/PicoShogun/blob/main/CHANGELOG.md"
"Release Notes" = "https://github.com/KirkForge/PicoShogun/releases"
"Source Code" = "https://github.com/KirkForge/PicoShogun"
"Bug Tracker" = "https://github.com/KirkForge/PicoShogun/issues"

[project.optional-dependencies]
observability = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "bandit>=1.7.0",
    "pip-audit>=0.7.0",
]

[project.scripts]
picoshogun = "api.server:main"
shogun = "api.server:main"  # backward compat alias

[tool.setuptools.packages.find]
include = [
    "api*",
    "config*",
    "database*",
    "middleware*",
    "services*",
    "plugins*",
    "front*",
]

[tool.setuptools.package-data]
config = ["*.json"]
plugins = ["*/plugin.json", "*/*.py"]
front = ["*.html", "*.css", "*.js", "*.svg", "*.png", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
norecursedirs = ["scripts", "plugins"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "B008", "N999", "N806", "SIM102", "SIM105", "E741", "B905", "B015", "E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
no_strict_optional = true
