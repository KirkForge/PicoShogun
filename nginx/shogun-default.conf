# Shogun — nginx reverse proxy configuration
#
# This config assumes TLS is terminated upstream (load balancer, cloud LB, etc).
# Do NOT run this bare on the internet without TLS termination.
# For production, add:
#   listen 443 ssl;
#   ssl_certificate /path/to/cert.pem;
#   ssl_certificate_key /path/to/key.pem;
#   add_header Strict-Transport-Security "max-age=63072000" always;

server {
    listen 80;
    server_name _;  # catch-all — restrict to your domain in production

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
