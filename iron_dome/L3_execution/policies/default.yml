# SecDev L3 Default Sandbox Policy
# Deny-by-default: everything is blocked unless explicitly allowed.
#
# Usage:
#   shogun sandbox run --policy default.yml -- ./command
#   python -m iron_dome.L3_execution.cli run --policy default.yml -- ./command

name: default
version: "1.0"
description: "Deny-by-default sandbox policy — restrict everything unless allowlisted"

rules:
  - rule_id: L3-SYS-001
    action: DENY
    description: "Block dangerous syscalls (execve, fork, clone, ptrace, mount)"
    patterns:
      - "execve"
      - "fork"
      - "vfork"
      - "clone"
      - "ptrace"
      - "mount"
      - "umount2"
      - "pivot_root"
      - "reboot"
      - "kexec_load"
      - "kexec_file_load"
      - "init_module"
      - "delete_module"
      - "finit_module"
      - "keyctl"
      - "request_key"
      - "add_key"
      - "swapon"
      - "swapoff"
      - "chroot"
      - "bpf"
    severity: CRITICAL

  - rule_id: L3-NET-001
    action: DENY
    description: "Block all outbound network connections not in allowlist"
    patterns: ["connect"]
    severity: HIGH

  - rule_id: L3-NET-002
    action: AUDIT
    description: "Flag DNS lookups to non-allowlisted domains"
    patterns: ["dns"]
    severity: MEDIUM

  - rule_id: L3-FS-001
    action: DENY
    description: "Block filesystem writes outside allowlist"
    patterns:
      - "write"
      - "rename"
      - "unlink"
      - "chmod"
      - "chown"
      - "mkdir"
      - "rmdir"
      - "symlink"
      - "link"
      - "truncate"
      - "mknod"
    severity: HIGH

  - rule_id: L3-FS-002
    action: DENY
    description: "Block filesystem reads outside allowlist"
    patterns: ["read"]
    severity: MEDIUM

  - rule_id: L3-PROC-001
    action: DENY
    description: "Block process spawning not in allowlist"
    patterns: ["spawn"]
    severity: CRITICAL

  - rule_id: L3-PROC-002
    action: DENY
    description: "Block sending signals to other processes"
    patterns: ["kill", "tgkill", "tkill", "rt_sigqueueinfo"]
    severity: HIGH

  - rule_id: L3-RES-001
    action: DENY
    description: "CPU time limit exceeded"
    severity: HIGH

  - rule_id: L3-RES-002
    action: DENY
    description: "Memory limit exceeded"
    severity: HIGH

  - rule_id: L3-RES-003
    action: DENY
    description: "Wall-time limit exceeded"
    severity: MEDIUM

# ─── Allowlists ────────────────────────────────────────────────────────
# Everything not listed here is DENIED.

network_allowlist: []
#  - "api.github.com"
#  - "registry.npmjs.org"

filesystem_write_allowlist:
  - "/tmp"
  - "/dev/null"

filesystem_read_allowlist:
  - "/usr"
  - "/lib"
  - "/lib64"
  - "/etc/alternatives"
  - "/etc/ld.so"
  - "/proc/self"
  - "/dev/null"
  - "/dev/urandom"
  - "/dev/random"

process_allowlist: []
#  - "node"
#  - "python3"

dns_allowlist: []
#  - "api.github.com"

# ─── Resource Limits ───────────────────────────────────────────────────

cpu_limit_seconds: 30
memory_limit_mb: 512
wall_time_limit_seconds: 60
