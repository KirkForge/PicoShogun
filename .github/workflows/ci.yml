# PicoShogun Command Centre — CI Pipeline
name: PicoShogun CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  PICOSHOGUN_ENV: test
  PICOSHOGUN_SECRET_KEY: ci-test-key-not-for-production-at-least-32b!

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint ─────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -r requirements.txt
      - name: Ruff check
        run: ruff check .
      - name: Mypy type check
        run: mypy api config database middleware services --ignore-missing-imports --no-strict-optional
        continue-on-error: true

  # ── Unit Tests ────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx
      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short --cov=. --cov-report=term-missing --cov-report=xml
        env:
          PICOSHOGUN_ENV: test
          PICOSHOGUN_SECRET_KEY: ci-test-key-at-least-32-bytes-long!
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage-report
          path: coverage.xml

  # ── Security Scan ─────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pip-audit bandit
      - name: pip-audit
        run: pip-audit -r requirements.txt
        continue-on-error: true
      - name: Bandit scan
        run: bandit -r . -f json -o bandit-report.json || true
        continue-on-error: true

  # ── Docker Build & E2E ──────────────────────────────────────────────
  docker:
    name: Docker Build & E2E
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t picoshogun:ci-test .
      - name: Install test dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y curl
      - name: E2E smoke test with PICOSHOGUN env vars
        run: |
          docker run -d --name picoshogun-ci-test -p 8765:8765 \
            -e PICOSHOGUN_SECRET_KEY=ci-test-key-at-least-32-bytes-long! \
            -e PICOSHOGUN_ENV=production \
            -e PICOSHOGUN_DATABASE_BACKEND=sqlite \
            -e PICOSHOGUN_API_HOST=0.0.0.0 \
            -e PICOSHOGUN_API_PORT=8765 \
            -e PICOSHOGUN_LOGGING_LEVEL=INFO \
            picoshogun:ci-test
          # Wait for service to start
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8765/health/live >/dev/null 2>&1; then break; fi
            sleep 1
          done
          # Unauthenticated health checks
          curl -sf http://localhost:8765/health || (docker logs picoshogun-ci-test && exit 1)
          curl -sf http://localhost:8765/health/live || (docker logs picoshogun-ci-test && exit 1)
          curl -sf http://localhost:8765/health/ready || (docker logs picoshogun-ci-test && exit 1)
          curl -sf http://localhost:8765/metrics/prometheus || (docker logs picoshogun-ci-test && exit 1)
          # Authenticated E2E
          curl -sf -X POST http://localhost:8765/auth/register \
            -H "Content-Type: application/json" \
            -d \'{"username":"ci_e2e","password":"ci-test-12345","role":"admin"}\' || true
          LOGIN=$(curl -sf -X POST "http://localhost:8765/auth/login?username=ci_e2e&password=ci-test-12345")
          TOKEN=$(echo "$LOGIN" | python3 -c "import sys,json; print(json.load(sys.stdin).get(\'access_token\',\'\'))" 2>/dev/null)
          if [ -n "$TOKEN" ]; then
            curl -sf -H "Authorization: Bearer $TOKEN" http://localhost:8765/api/v1/status || true
            curl -sf -H "Authorization: Bearer $TOKEN" http://localhost:8765/api/v1/projects || true
            curl -sf -H "Authorization: Bearer $TOKEN" http://localhost:8765/api/v1/dashboard/summary || true
            echo "E2E: Authenticated endpoints OK"
          else
            echo "E2E: Login failed — skipping authenticated checks"
          fi
          docker stop picoshogun-ci-test

  # ── Secrets Scan ──────────────────────────────────────────────────
  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install and run gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --verbose --no-banner
