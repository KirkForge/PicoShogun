name: CI

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'config/**'
      - 'database/**'
      - 'middleware/**'
      - 'services/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'config/**'
      - 'database/**'
      - 'middleware/**'
      - 'services/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt ruff mypy
      - run: ruff check .
      - run: mypy api config database middleware services --ignore-missing-imports --no-strict-optional

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt pytest pytest-cov pytest-asyncio httpx
      - run: python -m pytest tests/ -v --tb=short --cov=. --cov-report=term
        env:
          PICOSHOGUN_ENV: test
          PICOSHOGUN_SECRET_KEY: ci-test-key-at-least-32-bytes-long!