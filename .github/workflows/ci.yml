# PicoShogun Command Centre — CI Pipeline
name: PicoShogun CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  PICOSHOGUN_ENV: test
  PICOSHOGUN_SECRET_KEY: ci-test-key-not-for-production-at-least-32b!

jobs:
  # ── Lint ─────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -r requirements.txt
      - name: Ruff check
        run: ruff check .
      - name: Mypy type check
        run: mypy api config database middleware services --ignore-missing-imports --no-strict-optional
        continue-on-error: true

  # ── Unit Tests ────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx
      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short --cov=. --cov-report=term-missing --cov-report=xml
        env:
          PICOSHOGUN_ENV: test
          PICOSHOGUN_SECRET_KEY: ci-test-key-at-least-32-bytes-long!
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage-report
          path: coverage.xml

  # ── Security Scan ─────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pip-audit bandit
      - name: pip-audit
        run: pip-audit -r requirements.txt
        continue-on-error: true
      - name: Bandit scan
        run: bandit -r . -f json -o bandit-report.json || true
        continue-on-error: true

  # ── Docker Build ──────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t picoshogun:ci-test .
      - name: Smoke test
        run: |
          docker run -d --name picoshogun-ci-test -p 8765:8765 \
            -e PICOSHOGUN_SECRET_KEY=ci-test-key-at-least-32-bytes \
            -e PICOSHOGUN_ENV=production \
            picoshogun:ci-test
          sleep 5
          curl -sf http://localhost:8765/health || (docker logs picoshogun-ci-test && exit 1)
          docker stop picoshogun-ci-test

  # ── Secrets Scan ──────────────────────────────────────────────────
  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install and run gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --verbose --no-banner
