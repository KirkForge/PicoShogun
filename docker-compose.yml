# Shogun Command Centre — Docker Compose
# Usage: docker compose up -d
version: "3.9"

services:
  shogun:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shogun
    restart: unless-stopped
    ports:
      - "${SHOGUN_PORT:-8765}:8765"
    environment:
      SHOGUN_ENV: "${SHOGUN_ENV:-production}"
      SHOGUN_SECRET_KEY: "${SHOGUN_SECRET_KEY:?Set SHOGUN_SECRET_KEY}"
      SHOGUN_DEBUG: "${SHOGUN_DEBUG:-false}"
      SHOGUN_DDOS_SHIELD: "${SHOGUN_DDOS_SHIELD:-true}"
      DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL:-}"
      SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      EMAIL_FROM: "${EMAIL_FROM:-shogun@localhost}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-shogun}"
    volumes:
      - shogun-data:/app/data
      - shogun-logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - shogun-net

  # ── Optional: Prometheus for metrics scraping ──
  prometheus:
    image: prom/prometheus:latest
    container_name: shogun-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - shogun-net

  # ── Optional: Grafana for dashboards ──
  grafana:
    image: grafana/grafana:latest
    container_name: shogun-grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin}"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - shogun-net
    depends_on:
      - prometheus

  # ── Optional: OTel Collector for tracing ──
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: shogun-otel
    profiles: ["tracing"]
    restart: unless-stopped
    command: ["--config", "/etc/otel-collector-config.yml"]
    volumes:
      - ./deploy/otel-collector.yml:/etc/otel-collector-config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - shogun-net

volumes:
  shogun-data:
  shogun-logs:
  grafana-data:

networks:
  shogun-net:
    driver: bridge
