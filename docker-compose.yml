# PicoShogun Command Centre — Docker Compose
# Usage: docker compose up -d
version: "3.9"

services:
  picoshogun:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: picoshogun
    restart: unless-stopped
    ports:
      - "${SHOGUN_PORT:-8765}:8765"
    environment:
      PICOSHOGUN_ENV: "${PICOSHOGUN_ENV:-${SHOGUN_ENV:-production}}"
      PICOSHOGUN_SECRET_KEY: "${PICOSHOGUN_SECRET_KEY:-${SHOGUN_SECRET_KEY:?Set secret key}}"
      PICOSHOGUN_DEBUG: "${PICOSHOGUN_DEBUG:-${SHOGUN_DEBUG:-false}}"
      PICOSHOGUN_DDOS_SHIELD: "${PICOSHOGUN_DDOS_SHIELD:-${SHOGUN_DDOS_SHIELD:-true}}"
      DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL:-}"
      SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      EMAIL_FROM: "${EMAIL_FROM:-picoshogun@localhost}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-picoshogun}"
    volumes:
      - picoshogun-data:/app/data
      - picoshogun-logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - picopicoshogun-net

  # ── Optional: Prometheus for metrics scraping ──
  prometheus:
    image: prom/prometheus:latest
    container_name: picoshogun-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - picopicoshogun-net

  # ── Optional: Grafana for dashboards ──
  grafana:
    image: grafana/grafana:latest
    container_name: picoshogun-grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin}"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - picoshogun-net
    depends_on:
      - prometheus

  # ── Optional: OTel Collector for tracing ──
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: picoshogun-otel
    profiles: ["tracing"]
    restart: unless-stopped
    command: ["--config", "/etc/otel-collector-config.yml"]
    volumes:
      - ./deploy/otel-collector.yml:/etc/otel-collector-config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - picopicoshogun-net

volumes:
  picoshogun-data:
  picoshogun-logs:
  grafana-data:

networks:
  picopicoshogun-net:
    driver: bridge
